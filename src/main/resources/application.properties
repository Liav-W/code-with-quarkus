# Database connection settings
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus_db

# Modern Hibernate ORM Schema Management
quarkus.hibernate-orm.schema-generation.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Non-conflicting HTTP port (bypasses Apache on 8080)
quarkus.http.port=8081

# Separate HTTP port for unit test execution
%test.quarkus.http.test-port=8082