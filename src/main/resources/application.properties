# Database connection settings
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus_db

# -------------------------------------------------------------
# Flyway Configuration
# -------------------------------------------------------------
# Enable Flyway migrations on application startup
quarkus.flyway.migrate-at-start=true

# Optional: Customize the history table name (default: flyway_schema_history)
# quarkus.flyway.table=flyway_schema_history

# Optional: Specify target schema if different from default public schema
# quarkus.flyway.schemas=public

# -------------------------------------------------------------
# Hibernate ORM Settings
# -------------------------------------------------------------
# Disable Hibernate schema generation to let Flyway control DDL
quarkus.hibernate-orm.database.generation=none

# Remove or comment out drop-and-create/import.sql when using Flyway
# quarkus.hibernate-orm.sql-load-script=import.sql

# HTTP Ports
quarkus.http.port=8081
%test.quarkus.http.test-port=8082